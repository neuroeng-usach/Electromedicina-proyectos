site_name: Electromedicina-Proyectos

theme: 
  name: readthedocs
  features:
    - toc.integrate
    - navigation.expand
    - toc.follow
    - navigation.sections
    - header.autohide
    - content.code.annotate
    # - navigation.tabs       # Adds top-level navigation tabs
    - content.code.copy     # Adds a copy button to code blocks

plugins:
  - search

markdown_extensions:
  # Standard extensions for essential formatting
  - admonition          # Required for !!! note "Title" blocks
  - attr_list           # Allows adding CSS classes/styles to Markdown
  - def_list            # Support for definition lists
  - footnotes           # Support for [^1] style footnotes
  - md_in_html          # Allows Markdown inside <div> or other HTML tags
  - toc:
      permalink: true   # Adds clickable anchor links next to headers

  # PyMdown Extensions for advanced technical features
  - pymdownx.highlight: # Superior code syntax highlighting
      anchor_linenums: true
  - pymdownx.inlinehilite: # Highlighting for `inline code`
  - pymdownx.superfences: # Allows nesting and Mermaid diagrams
  - pymdownx.tabbed:      # Required for [Content Tabs]
      alternate_style: true
  - pymdownx.tasklist:    # Required for - [x] task checkboxes
      custom_checkbox: true
  - pymdownx.emoji:       # Support for :material-account: icons
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  
#   - https://cloudflare.com

  
nav:
  - Semestre: 
      - 2026a:
        - "Actividad electromiografía (EMG) en la lesión y reconstrucción del ligamento cruzado anterior (LCA/ACLR) : Una revisión sistemática" : 2026_1/proy1/index.md
        - "Biomarcadores neurofisiológicos gingivales : evaluación de la función sensitiva del nervio trigémino en la región gingival como herramienta para la identificación de alteraciones asociadas a enfermedades neurológicas" : 2026_1/proy2/index.md
        - "Evaluación del Enlentecimiento Espectral en EEG como Biomarcador de Deterioro Cortical en la Enfermedad de Parkinson: Revisión de la literatura con Validación Computacional" : 2026_1/proy3/proyecto_electro_parkinson.md
        - "Análisis del rendimiento diagnóstico y limitaciones técnicas de la Tomografía por Electroimpedancia para la detección del cáncer de mama: Revisión Bibliográfica" : 2026_1/proy4/index.md
        - "Diseño, Implementación y Validación Preliminar de un Sistema Inalámbrico de Adquisición de Electromiografía de Superficie (SEMG) Basado en ESP32, con Electrodos Pasivos y Módulo Comercial de Acondicionamiento EMG" : 2026_1/proy5/index.md
        - "Diseño y Desarrollo de un Sensor Portátil de Respuesta Galvánica de la Piel (GSR)" : 2026_1/proy6/index.md



 
